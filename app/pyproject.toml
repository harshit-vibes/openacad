[project]
name = "openacad"
version = "0.1.0"
description = "AI-first scholarly research platform — markdown vault + agentic harness + Obsidian-compatible atoms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web + cli
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
    # data
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.4",
    # storage: SQLite is stdlib; no extra dep required
    # agents
    "pydantic-ai>=0.0.13",
    # embeddings
    "sentence-transformers>=3.3",
    "numpy>=2.0",
    # parsing
    "pymupdf>=1.24",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    # logging
    "structlog>=24.4",
    # http client (for tests + ad-hoc)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
museum = [
    "streamlit>=1.40",
    "pandas>=2.2",
]
claude = [
    # Model Context Protocol SDK — exposes the tool registry as an MCP stdio server
    # so Claude Code / Claude Desktop / Cursor / Zed can call openacad tools natively.
    "mcp>=1.0",
]

[project.scripts]
openacad = "openacad.cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openacad", "museum"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
