[project]
name = "openacad-demo"
version = "0.1.0"
description = "Atomic-notes research lifecycle demo — proves tier-A AI assistance beats raw-PDF RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web + cli
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
    # data
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "networkx>=3.4",
    # storage: SQLite is stdlib; no extra dep required
    # agents
    "pydantic-ai>=0.0.13",
    # embeddings
    "sentence-transformers>=3.3",
    "numpy>=2.0",
    # parsing
    "pymupdf>=1.24",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    # logging
    "structlog>=24.4",
    # http client (for tests + ad-hoc)
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
openacad = "apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openacad", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
